name: Apache Superset

on:
  pull_request:
    types:
      - closed
      - opened
      - synchronize
    paths:
      - .github/workflows/superset.yaml
      - superset/**
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  attestations: write
  packages: write

env:
  # renovate: datasource=docker depName=apachesuperset.docker.scarf.sh/apache/superset
  APP_VER: 6.1.0

jobs:
  docker-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: superset
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Docker build and push
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          push: true
          build-args: |-
            SUPERSET=${{ env.APP_VER }}
          tags: &image ghcr.io/${{ github.repository_owner }}/superset:${{ env.APP_VER }}
          context: ./superset
      - name: Generate artifact attestation
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: &subject-name ghcr.io/${{ github.repository_owner }}/superset
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: *image
          output-file: &sbom spdx.json
          format: cyclonedx-json
      - uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: *subject-name
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
          sbom-path: *sbom
